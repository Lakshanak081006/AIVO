services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autonomous_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autonomous_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@database:5432/autonomous_assistant
      AUTO_CREATE_DB: "true"
      JWT_SECRET_KEY: docker-development-secret-change-in-production
      FRONTEND_URL: http://localhost:5173,http://localhost:8080
      DEMONSTRATION_MODE: "true"
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
